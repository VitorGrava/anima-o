<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragão sobre o Tesouro</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0809; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
"use strict";
const S = 1024;
const view = document.getElementById('c');
const vctx = view.getContext('2d');

/* ---------- utilidades ---------- */
let seed = 1337;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
function layer() { const c = document.createElement('canvas'); c.width = c.height = S; return c; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function mix(c1, c2, t) { // cores [r,g,b]
  return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
}
function rgb(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function ramp(stops, t) { // stops: [[t,[r,g,b]],...]
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const a = stops[i - 1], b = stops[i];
    return mix(a[1], b[1], (t - a[0]) / (b[0] - a[0] || 1));
  }
  return stops[stops.length - 1][1];
}

// ruído de valor (fbm) para texturas
function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); a *= 0.5; f *= 2; } return s; }
function noiseCanvas(scale, octaves, lo, hi, tint) {
  const n = 256, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), im = g.createImageData(n, n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const v = lerp(lo, hi, fbm(x * scale, y * scale, octaves)), i = (y * n + x) * 4;
    im.data[i] = v * tint[0]; im.data[i + 1] = v * tint[1]; im.data[i + 2] = v * tint[2]; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0); return c;
}

// curvas Catmull-Rom
function cr(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3));
}
function sample(pts, n) {
  const out = [], P = [pts[0], ...pts, pts[pts.length - 1]], seg = pts.length - 1;
  for (let i = 0; i <= n; i++) {
    const u = i / n * seg, s = Math.min(seg - 1, Math.floor(u)), t = u - s;
    out.push(cr(P[s], P[s + 1], P[s + 2], P[s + 3], t));
  }
  return out;
}
function smooth(g, pts, closed = true) {
  const n = pts.length;
  const P = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  g.moveTo(pts[0][0], pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    g.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) g.closePath();
}
// tubo afinado ao longo de uma curva: devolve {L, R, C, N, W}
function tube(pts, wfn, n = 80) {
  const C = sample(pts, n), L = [], R = [], N = [], W = [];
  for (let i = 0; i <= n; i++) {
    const a = C[Math.max(0, i - 1)], b = C[Math.min(n, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const nx = -ty, ny = tx, w = wfn(i / n) / 2;
    N.push([nx, ny, tx, ty]); W.push(w);
    L.push([C[i][0] + nx * w, C[i][1] + ny * w]); R.push([C[i][0] - nx * w, C[i][1] - ny * w]);
  }
  return { L, R, C, N, W };
}
function tubePath(g, T) {
  g.moveTo(T.L[0][0], T.L[0][1]);
  T.L.forEach(p => g.lineTo(p[0], p[1]));
  // ponta arredondada
  const e = T.C[T.C.length - 1], we = T.W[T.W.length - 1], ne = T.N[T.N.length - 1];
  g.arc(e[0], e[1], Math.max(0.5, we), Math.atan2(ne[1], ne[0]), Math.atan2(ne[1], ne[0]) - Math.PI, true);
  for (let i = T.R.length - 1; i >= 0; i--) g.lineTo(T.R[i][0], T.R[i][1]);
  const s = T.C[0], ws = T.W[0], ns = T.N[0];
  g.arc(s[0], s[1], Math.max(0.5, ws), Math.atan2(-ns[1], -ns[0]), Math.atan2(-ns[1], -ns[0]) - Math.PI, true);
  g.closePath();
}

/* ---------- paleta ---------- */
const RED = {
  deep: [44, 8, 36], shadow: [92, 16, 46], mid: [150, 28, 34], base: [190, 44, 32],
  light: [228, 86, 48], hi: [255, 150, 90]
};
const GOLD = [[0, [58, 20, 14]], [0.25, [128, 50, 18]], [0.5, [206, 120, 28]], [0.72, [240, 186, 56]], [0.9, [255, 226, 120]], [1, [255, 248, 210]]];
const LIGHT_DIR = [-0.62, -0.78]; // luz vem de cima à esquerda

/* ---------- camadas de sombreamento ---------- */
function edge(src, dx, dy) {
  const e = layer(), g = e.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'destination-out'; g.drawImage(src, dx, dy);
  return e;
}
function tint(src, color, blur) {
  const e = layer(), g = e.getContext('2d');
  if (blur) g.filter = `blur(${blur}px)`;
  g.drawImage(src, 0, 0); g.filter = 'none';
  g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, S, S);
  return e;
}
// aplica luz de contorno, sombra própria e oclusão numa camada já preenchida
function shadeVolume(L, o = {}) {
  const g = L.getContext('2d');
  let mask = o.mask;
  if (!mask) { mask = layer(); mask.getContext('2d').drawImage(L, 0, 0); }
  // primeiro recorta tudo que vazou da silhueta (screen/multiply pintam fora)
  g.save(); g.globalCompositeOperation = 'destination-in'; g.drawImage(mask, 0, 0); g.restore();
  g.save(); g.globalCompositeOperation = 'source-atop';
  // sombra própria: borda oposta à luz, larga e suave
  const sh = edge(mask, -(o.shadowW || 34), -(o.shadowW || 34) * 0.8);
  g.globalAlpha = o.shadowA ?? 0.75; g.drawImage(tint(sh, rgb(RED.deep), o.shadowBlur || 18), 0, 0);
  // núcleo de sombra mais estreito
  const sh2 = edge(mask, -10, -8);
  g.globalAlpha = 0.5; g.drawImage(tint(sh2, rgb(RED.deep), 4), 0, 0);
  // luz de contorno do feixe (borda virada para a luz), só onde o feixe alcança
  const rim = edge(mask, o.rimW || 7, (o.rimW || 7) * 1.2);
  const focus = (src) => {
    if (!o.rimFocus) return src;
    const fg = src.getContext('2d'); fg.save(); fg.globalCompositeOperation = 'destination-in';
    const [fx, fy, fr] = o.rimFocus, gr = fg.createRadialGradient(fx, fy, fr * 0.25, fx, fy, fr);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0.12)');
    fg.fillStyle = gr; fg.fillRect(0, 0, S, S); fg.restore(); return src;
  };
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = o.rimA ?? 0.55; g.drawImage(focus(tint(rim, 'rgb(255,150,80)', 2.5)), 0, 0);
  g.globalAlpha = (o.rimA ?? 0.55) * 0.35; g.drawImage(focus(tint(rim, 'rgb(255,190,130)', 0.6)), 0, 0);
  // luz larga refletida
  const lit = edge(mask, 26, 30);
  g.globalAlpha = o.litA ?? 0.25; g.drawImage(focus(tint(lit, 'rgb(240,110,60)', 16)), 0, 0);
  g.restore();
}

/* ---------- geometria do dragão ---------- */
const NECK = tube([[560, 625], [478, 560], [420, 478], [412, 405], [436, 348], [458, 300]],
  t => lerp(200, 100, Math.pow(t, 0.6)), 90);
const BODY = tube([[490, 630], [610, 622], [730, 628], [850, 636], [940, 645]],
  t => 156 + 8 * Math.sin(t * Math.PI) - 6 * t, 60);
const TAIL = tube([[935, 640], [992, 690], [1010, 780], [965, 860], [860, 906], [700, 926], [530, 918], [400, 902], [292, 886], [252, 880]],
  t => lerp(140, 6, Math.pow(t, 0.75)), 160);
const UPPERARM = tube([[505, 600], [515, 670], [482, 735]], t => lerp(116, 86, t), 30);
const THIGH = tube([[830, 600], [880, 670], [902, 735]], t => lerp(176, 104, t), 30);

function headPath(g) {
  // crânio + maxila (boca entreaberta: maxila de cima)
  smooth(g, [
    [214, 266], [232, 252], [268, 238], [300, 222], [326, 204], [356, 190], [392, 178], [432, 176], [466, 190],
    [486, 222], [488, 262], [470, 302], [440, 312], [400, 304], [368, 300], [330, 294], [290, 288], [250, 284], [222, 282]
  ]);
}
function jawPath(g) {
  smooth(g, [
    [250, 332], [292, 324], [334, 316], [374, 310], [412, 307], [444, 316], [460, 338], [440, 360],
    [400, 364], [356, 361], [312, 357], [272, 352], [252, 346]
  ]);
}
function bodyMaskDraw(g) {
  g.beginPath(); tubePath(g, NECK); g.fill();
  g.beginPath(); tubePath(g, BODY); g.fill();
  // ombro, braço superior, coxa: na MESMA silhueta (anatomia contínua)
  g.beginPath(); g.ellipse(520, 610, 100, 92, -0.3, 0, Math.PI * 2); g.fill();
  g.beginPath(); tubePath(g, UPPERARM); g.fill();
  g.beginPath(); g.ellipse(850, 630, 110, 92, 0.35, 0, Math.PI * 2); g.fill();
  g.beginPath(); tubePath(g, THIGH); g.fill();
  // dorso: corcova suave entre ombros e anca
  g.beginPath(); smooth(g, [[540, 560], [600, 528], [660, 536], [740, 552], [820, 540], [880, 548], [940, 590], [920, 660], [600, 660]]); g.fill();
  // barriga
  g.beginPath(); g.ellipse(700, 676, 170, 48, 0.02, 0, Math.PI * 2); g.fill();
  g.beginPath(); headPath(g); g.fill();
  g.beginPath(); jawPath(g); g.fill();
}

/* ---------- desenho da cena ---------- */
function drawBackground(g) {
  // parede base
  let gr = g.createLinearGradient(0, 0, 0, S);
  gr.addColorStop(0, '#1a0f14'); gr.addColorStop(0.55, '#2a1a1e'); gr.addColorStop(1, '#1a0e10');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  // blocos de pedra
  const stone = noiseCanvas(0.03, 5, 0.6, 1.25, [62, 44, 46]);
  g.save(); g.globalAlpha = 0.9; g.globalCompositeOperation = 'source-over';
  seed = 7;
  for (let y = 0; y < 760; y += 54) {
    const off = (y / 54) % 2 ? 0 : 60;
    for (let x = -off; x < S; x += 120) {
      const w = 116, h = 50, l = rr(0.65, 1.0);
      g.save(); g.globalAlpha = 0.55 * l;
      g.drawImage(stone, rr(0, 120), rr(0, 120), 120, 120, x + 2, y + 2, w, h);
      g.restore();
      // juntas
      g.fillStyle = 'rgba(10,5,8,0.55)'; g.fillRect(x, y + h + 2, w + 4, 3); g.fillRect(x + w + 1, y, 3, h + 4);
      g.fillStyle = 'rgba(160,110,90,0.06)'; g.fillRect(x + 3, y + 3, w - 4, 2);
    }
  }
  g.restore();
  // arco do teto
  g.save();
  gr = g.createLinearGradient(0, 0, 0, 120);
  gr.addColorStop(0, '#120a0e'); gr.addColorStop(1, 'rgba(18,10,14,0)');
  g.fillStyle = gr; g.fillRect(0, 0, S, 140);
  g.restore();
  // pilares
  function pillar(x, w, top, bot, lightSide) {
    gr = g.createLinearGradient(x, 0, x + w, 0);
    gr.addColorStop(0, lightSide ? '#4a3330' : '#22161a');
    gr.addColorStop(0.35, lightSide ? '#3a2826' : '#2c1d20');
    gr.addColorStop(1, '#140b0e');
    g.fillStyle = gr; g.fillRect(x, top, w, bot - top);
    g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.6;
    g.drawImage(stone, 0, 0, 80, 256, x, top, w, bot - top); g.restore();
    // caneluras
    for (let i = 1; i < 5; i++) {
      const fx = x + w * i / 5;
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(fx, top, 3, bot - top);
      g.fillStyle = 'rgba(255,190,140,0.05)'; g.fillRect(fx + 3, top, 2, bot - top);
    }
    // anéis entalhados
    for (let y = top + 80; y < bot; y += 120) {
      g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(x - 4, y, w + 8, 12);
      g.fillStyle = 'rgba(200,140,100,0.12)'; g.fillRect(x - 4, y, w + 8, 3);
      // runas em losango
      for (let k = 0; k < 4; k++) {
        const cx = x + w * (k + 0.5) / 4, cy = y + 6;
        g.fillStyle = 'rgba(190,120,70,0.18)';
        g.beginPath(); g.moveTo(cx, cy - 4); g.lineTo(cx + 4, cy); g.lineTo(cx, cy + 4); g.lineTo(cx - 4, cy); g.fill();
      }
    }
  }
  pillar(0, 150, 120, S, false);
  pillar(185, 70, 150, S, true);
  pillar(905, 90, 0, 700, false);
  // capitel com friso anão (losangos)
  g.fillStyle = '#1f1317'; g.fillRect(0, 100, 260, 34);
  g.fillStyle = 'rgba(200,140,90,0.10)'; g.fillRect(0, 100, 260, 3);
  for (let x = 10; x < 250; x += 26) {
    g.fillStyle = 'rgba(160,100,70,0.22)';
    g.beginPath(); g.moveTo(x, 117); g.lineTo(x + 9, 108); g.lineTo(x + 18, 117); g.lineTo(x + 9, 126); g.fill();
  }
  g.fillStyle = '#1b1014'; g.fillRect(890, 60, 120, 40);
  // viga do teto
  g.fillStyle = '#1a0f13'; g.fillRect(260, 40, 700, 26);
  g.fillStyle = 'rgba(180,120,90,0.07)'; g.fillRect(260, 40, 700, 2);
  // runa na pedra
  g.strokeStyle = 'rgba(200,150,100,0.35)'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(48, 30); g.lineTo(48, 90); g.moveTo(48, 44); g.lineTo(68, 30); g.moveTo(48, 62); g.lineTo(68, 48); g.stroke();
  // escuro em baixo e nos cantos
  gr = g.createRadialGradient(420, 330, 80, 520, 500, 760);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(8,3,6,0.75)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
}

function beamPolygon(g, spread = 0) {
  g.beginPath();
  g.moveTo(170 - spread, -20); g.lineTo(360 + spread, -20);
  g.lineTo(700 + spread, 780); g.lineTo(330 - spread, 780); g.closePath();
}
function drawBeam(g, alpha) {
  const L = layer(), b = L.getContext('2d');
  b.filter = 'blur(26px)';
  const gr = b.createLinearGradient(260, 0, 520, 760);
  gr.addColorStop(0, 'rgba(255,214,150,0.55)'); gr.addColorStop(0.6, 'rgba(255,170,90,0.28)'); gr.addColorStop(1, 'rgba(255,150,70,0.05)');
  b.fillStyle = gr; beamPolygon(b); b.fill();
  b.filter = 'blur(8px)';
  b.fillStyle = 'rgba(255,220,170,0.18)';
  b.beginPath(); b.moveTo(215, -20); b.lineTo(300, -20); b.lineTo(560, 760); b.lineTo(430, 760); b.closePath(); b.fill();
  b.filter = 'none';
  g.save(); g.globalAlpha = alpha; g.globalCompositeOperation = 'screen'; g.drawImage(L, 0, 0); g.restore();
}

// fonte de luz para iluminar ouro: proximidade do feixe
function beamLight(x, y) {
  // eixo do feixe: de (265,0) a (515,780)
  const ax = 265, ay = 0, bx = 515, by = 780;
  const vx = bx - ax, vy = by - ay, t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy), 0, 1.3);
  const px = ax + vx * t, py = ay + vy * t, d = Math.hypot(x - px, y - py);
  const halfW = lerp(95, 190, t);
  return Math.exp(-Math.pow(d / halfW, 2) * 1.6);
}

function moundPath(g) {
  smooth(g, [[-40, 1064], [-40, 840], [60, 806], [170, 772], [270, 738], [370, 712], [480, 694], [600, 684], [720, 688], [840, 698],
             [940, 716], [1064, 742], [1064, 1064]]);
}
function backPilePath(g) {
  smooth(g, [[100, 790], [150, 730], [230, 690], [320, 668], [420, 676], [470, 700], [420, 760]]);
}

function coin(g, x, y, r, L, rot) {
  const c = ramp(GOLD, L), d = ramp(GOLD, L - 0.32), h = ramp(GOLD, L + 0.22);
  const ry = r * lerp(0.45, 0.9, rnd());
  g.save(); g.translate(x, y); g.rotate(rot);
  g.fillStyle = rgb(d); g.beginPath(); g.ellipse(0, r * 0.12, r, ry, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = rgb(c); g.beginPath(); g.ellipse(0, 0, r * 0.94, ry * 0.9, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = rgb(d, 0.6); g.lineWidth = Math.max(0.6, r * 0.12);
  g.beginPath(); g.ellipse(0, 0, r * 0.62, ry * 0.58, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = rgb(h, 0.9); g.beginPath(); g.ellipse(-r * 0.3, -ry * 0.35, r * 0.4, ry * 0.25, -0.3, 0, Math.PI * 2); g.fill();
  g.restore();
}

function scatterCoins(g, pathFn, count, sizeFn, lightFn, region) {
  const P = new Path2D(); const tmp = document.createElement('canvas').getContext('2d');
  // usa um contexto auxiliar para isPointInPath
  tmp.beginPath(); pathFn(tmp);
  const pts = [];
  let tries = 0;
  while (pts.length < count && tries < count * 8) {
    tries++;
    const x = rr(region[0], region[2]), y = rr(region[1], region[3]);
    if (tmp.isPointInPath(x, y)) pts.push([x, y]);
  }
  pts.sort((a, b) => a[1] - b[1]);
  for (const [x, y] of pts) {
    const r = sizeFn(x, y) * rr(0.75, 1.25);
    coin(g, x, y, r, lightFn(x, y) + rr(-0.12, 0.12), rr(-0.5, 0.5));
  }
}

function goldLight(topY) {
  return (x, y) => {
    const b = beamLight(x, y);
    const depth = clamp((y - topY) / 340, 0, 1);
    const side = clamp(Math.abs(x - 500) / 520, 0, 1);
    return clamp(0.56 + 0.44 * b - 0.18 * depth - 0.26 * side * side, 0, 1);
  };
}

function drawGoldMound(g) {
  // base contínua sob as moedas
  g.save(); g.beginPath(); moundPath(g);
  let gr = g.createLinearGradient(0, 690, 0, S);
  gr.addColorStop(0, '#c98a24'); gr.addColorStop(0.4, '#8c4416'); gr.addColorStop(1, '#3a160c');
  g.fillStyle = gr; g.fill(); g.clip();
  // luz difusa do feixe sobre o monte
  gr = g.createRadialGradient(480, 760, 20, 480, 780, 420);
  gr.addColorStop(0, 'rgba(255,220,120,0.7)'); gr.addColorStop(1, 'rgba(255,200,100,0)');
  g.fillStyle = gr; g.fillRect(0, 600, S, 424);
  seed = 99;
  scatterCoins(g, moundPath, 9000, (x, y) => lerp(4, 13, clamp((y - 680) / 344, 0, 1)), goldLight(690), [0, 680, S, S]);
  // sombreamento da curvatura do monte
  g.globalCompositeOperation = 'multiply';
  gr = g.createLinearGradient(0, 0, S, 0);
  gr.addColorStop(0, 'rgba(90,40,40,0.55)'); gr.addColorStop(0.35, 'rgba(255,255,255,0)'); gr.addColorStop(0.7, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(90,30,40,0.6)');
  g.fillStyle = gr; g.fillRect(0, 600, S, 424);

function drawWing(g, o) {
  // o: shoulder, elbow, wrist, tips[], attach (no corpo), cores
  const L = layer(), w = L.getContext('2d');
  const { S: sh, E, W, tips, attach } = o;
  // membrana
  w.beginPath();
  w.moveTo(W[0], W[1]);
  w.lineTo(tips[0][0], tips[0][1]);
  for (let i = 1; i < tips.length; i++) {
    const a = tips[i - 1], b = tips[i];
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const cx = lerp(mx, W[0], o.scallop), cy = lerp(my, W[1], o.scallop);
    w.quadraticCurveTo(cx, cy, b[0], b[1]);
  }
  const last = tips[tips.length - 1];
  w.quadraticCurveTo(lerp((last[0] + attach[0]) / 2, W[0], o.scallop * 0.8), lerp((last[1] + attach[1]) / 2, W[1], o.scallop * 0.8), attach[0], attach[1]);
  w.lineTo(E[0], E[1]); w.lineTo(sh[0], sh[1]); w.lineTo(W[0], W[1]); w.closePath();
  // gradiente: translúcida perto das bordas, mais densa perto do braço
  let gr = w.createRadialGradient(W[0], W[1], 30, W[0], W[1], o.reach);
  gr.addColorStop(0, rgb(o.memIn)); gr.addColorStop(1, rgb(o.memOut));
  w.fillStyle = gr; w.globalAlpha = o.alpha; w.fill(); w.globalAlpha = 1;
  // brilho transmitido entre os dedos (luz atravessando)
  w.save(); w.clip();
  w.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < tips.length; i++) {
    const a = tips[i], b = i + 1 < tips.length ? tips[i + 1] : attach;
    const cx = (a[0] + b[0] + W[0]) / 3, cy = (a[1] + b[1] + W[1]) / 3;
    gr = w.createRadialGradient(cx, cy, 5, cx, cy, o.reach * 0.45);
    gr.addColorStop(0, rgb(o.glow, o.glowA)); gr.addColorStop(1, rgb(o.glow, 0));
    w.fillStyle = gr; w.fillRect(0, 0, S, S);
  }
  // veias: ramificam dos dedos em direção à borda recortada
  seed = o.seed;
  w.lineCap = 'round';
  for (let i = 0; i < tips.length; i++) {
    const a = tips[i], b = i + 1 < tips.length ? tips[i + 1] : attach;
    for (const t of [0.3, 0.5, 0.7]) {
      const sx = lerp(W[0], a[0], t), sy = lerp(W[1], a[1], t);
      const ex = lerp(lerp(a[0], b[0], 0.5), W[0], o.scallop + 0.05 + (0.7 - t) * 0.25), ey = lerp(lerp(a[1], b[1], 0.5), W[1], o.scallop + 0.05 + (0.7 - t) * 0.25);
      const mx = lerp(sx, ex, 0.5), my = lerp(sy, ey, 0.5);
      const qx = lerp(mx, lerp(a[0], b[0], 0.5), 0.15), qy = lerp(my, lerp(a[1], b[1], 0.5), 0.15);
      w.strokeStyle = rgb(o.vein, 0.4); w.lineWidth = 1.8;
      w.beginPath(); w.moveTo(sx, sy); w.quadraticCurveTo(qx, qy, ex, ey); w.stroke();
      w.strokeStyle = rgb(o.glow, 0.18); w.lineWidth = 1;
      w.beginPath(); w.moveTo(sx + 2, sy - 2); w.quadraticCurveTo(qx + 2, qy - 2, ex + 2, ey - 2); w.stroke();
    }
  }
  // sombra da membrana: mais escura junto ao corpo e embaixo
  w.globalCompositeOperation = 'source-atop';
  gr = w.createLinearGradient(W[0], W[1], attach[0], attach[1] + 40);
  gr.addColorStop(0, 'rgba(40,6,26,0)'); gr.addColorStop(0.6, 'rgba(40,6,26,0.15)'); gr.addColorStop(1, 'rgba(40,6,26,0.6)');
  w.fillStyle = gr; w.fillRect(0, 0, S, S);
  // dobras/sombras na membrana junto aos dedos
  for (const tp of [...tips]) {
    w.strokeStyle = rgb(o.fold, 0.5); w.lineWidth = 22; w.filter = 'blur(10px)';
    w.beginPath(); w.moveTo(W[0], W[1]); w.lineTo(tp[0], tp[1]); w.stroke(); w.filter = 'none';
  }
  w.restore();
  // ossos dos dedos (afinando)
  for (const tp of tips) {
    const T = tube([W, [lerp(W[0], tp[0], 0.5) + (tp[1] - W[1]) * 0.04, lerp(W[1], tp[1], 0.5) - (tp[0] - W[0]) * 0.04], tp], t => lerp(o.bone, 3, t), 30);
    w.fillStyle = rgb(o.boneC); w.beginPath(); tubePath(w, T); w.fill();
    w.strokeStyle = rgb(o.boneHi, 0.6); w.lineWidth = 1.6;
    w.beginPath(); T.L.forEach((p, i) => i ? w.lineTo(p[0], p[1]) : w.moveTo(p[0], p[1])); w.stroke();
  }
  // braço (úmero e antebraço)
  const arm = tube([sh, [lerp(sh[0], E[0], 0.5), lerp(sh[1], E[1], 0.5) - 10], E], t => lerp(o.bone * 3.2, o.bone * 2.2, t), 30);
  const fore = tube([E, [lerp(E[0], W[0], 0.5) + 10, lerp(E[1], W[1], 0.5)], W], t => lerp(o.bone * 2.3, o.bone * 1.6, t), 30);
  w.fillStyle = rgb(o.boneC);
  w.beginPath(); tubePath(w, arm); w.fill();
  w.beginPath(); tubePath(w, fore); w.fill();
  w.beginPath(); w.arc(E[0], E[1], o.bone * 1.3, 0, Math.PI * 2); w.fill();
  w.beginPath(); w.arc(W[0], W[1], o.bone * 1.2, 0, Math.PI * 2); w.fill();
  // garra do polegar
  w.fillStyle = '#e9dcc0';
  w.beginPath(); w.moveTo(W[0] - 6, W[1] - 4); w.quadraticCurveTo(W[0] - 20, W[1] - 26, W[0] - 14, W[1] - 40); w.quadraticCurveTo(W[0] - 4, W[1] - 20, W[0] + 6, W[1] - 6); w.fill();
  shadeVolume(L, { shadowW: 10, shadowA: 0.5, shadowBlur: 6, rimW: 4, rimA: o.rimA, litA: 0.1 });
  g.drawImage(L, 0, 0);
}

function drawSpines(g, pts, n, size, from, to) {
  const C = sample(pts, 200);
  for (let i = 0; i < n; i++) {
    const t = lerp(from, to, i / (n - 1));
    const k = Math.round(t * 200), p = C[k], q = C[Math.min(200, k + 1)], pr = C[Math.max(0, k - 1)];
    let tx = q[0] - pr[0], ty = q[1] - pr[1]; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const nx = ty, ny = -tx; // normal "para fora" (lado de cima)
    const s = size(t);
    const tipx = p[0] + nx * s * 1.6 + tx * s * 0.9, tipy = p[1] + ny * s * 1.6 + ty * s * 0.9;
    const gr = g.createLinearGradient(p[0], p[1], tipx, tipy);
    gr.addColorStop(0, '#7a4a3e'); gr.addColorStop(0.5, '#cdb89a'); gr.addColorStop(1, '#f6ead2');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(p[0] - tx * s * 0.55, p[1] - ty * s * 0.55);
    g.quadraticCurveTo(p[0] + nx * s * 0.6 - tx * s * 0.2, p[1] + ny * s * 0.6 - ty * s * 0.2, tipx, tipy);
    g.quadraticCurveTo(p[0] + nx * s * 0.6 + tx * s * 0.5, p[1] + ny * s * 0.6 + ty * s * 0.5, p[0] + tx * s * 0.55, p[1] + ty * s * 0.55);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(70,20,30,0.5)'; g.lineWidth = 1; g.stroke();
  }
}

function spinesEdge(g, T, side, tilt, from, to, n, sizeFn) {
  const M = T.C.length - 1;
  for (let k = 0; k < n; k++) {
    const t = lerp(from, to, k / Math.max(1, n - 1)), i = Math.round(t * M);
    const c = T.C[i], [nx, ny, tx, ty] = T.N[i], w = T.W[i];
    const ox = nx * side, oy = ny * side, bx = tx * tilt, by = ty * tilt;
    const s = sizeFn(t), px = c[0] + ox * w * 0.86, py = c[1] + oy * w * 0.86;
    const tipx = px + ox * s * 1.7 + bx * s * 1.1, tipy = py + oy * s * 1.7 + by * s * 1.1;
    const gr = g.createLinearGradient(px, py, tipx, tipy);
    gr.addColorStop(0, '#5a1a26'); gr.addColorStop(0.45, '#b89a84'); gr.addColorStop(1, '#f2e4c8');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(px - bx * s * 0.6, py - by * s * 0.6);
    g.quadraticCurveTo(px + ox * s * 0.9 - bx * s * 0.1, py + oy * s * 0.9 - by * s * 0.1, tipx, tipy);
    g.quadraticCurveTo(px + ox * s * 0.5 + bx * s * 0.5, py + oy * s * 0.5 + by * s * 0.5, px + bx * s * 0.7, py + by * s * 0.7);
    g.closePath(); g.fill();
    // lado da sombra do espinho
    g.fillStyle = 'rgba(60,10,30,0.35)';
    g.beginPath(); g.moveTo(px + bx * s * 0.1, py + by * s * 0.1); g.lineTo(tipx, tipy);
    g.quadraticCurveTo(px + ox * s * 0.5 + bx * s * 0.5, py + oy * s * 0.5 + by * s * 0.5, px + bx * s * 0.7, py + by * s * 0.7); g.closePath(); g.fill();
  }
}

function scalesAlong(g, T, opt) {
  // escamas ao longo de um tubo; posição transversal por seno (escorço do cilindro)
  const rows = opt.rows, cols = opt.cols;
  for (let i = 0; i < T.C.length; i += opt.step) {
    const c = T.C[i], [nx, ny, tx, ty] = T.N[i], w = T.W[i];
    if (w < 4) continue;
    for (let k = 0; k < cols; k++) {
      const th = -Math.PI / 2 + (k + 0.5 + (i / opt.step % 2) * 0.5) / cols * Math.PI;
      const s = Math.sin(th) * w * 0.98;
      const fore = Math.cos(th); // 1 no centro, 0 nas bordas
      const x = c[0] + nx * s, y = c[1] + ny * s;
      const size = (w * Math.PI / cols) * 0.5 * (0.35 + 0.65 * fore);
      if (size < 1.2) continue;
      const ang = Math.atan2(ty, tx);
      g.save(); g.translate(x, y); g.rotate(ang);
      g.strokeStyle = `rgba(40,6,24,${0.35 * (0.4 + 0.6 * fore)})`; g.lineWidth = Math.max(0.8, size * 0.16);
      g.beginPath(); g.ellipse(0, 0, size * 0.55, size * 0.9 * fore + size * 0.2, 0, -Math.PI / 2, Math.PI / 2); g.stroke();
      g.strokeStyle = `rgba(255,150,100,${0.13 * fore})`; g.lineWidth = Math.max(0.6, size * 0.1);
      g.beginPath(); g.ellipse(-size * 0.18, 0, size * 0.45, size * 0.7 * fore + size * 0.15, 0, -Math.PI / 2, 0); g.stroke();
      g.restore();
    }
  }
}

  shadeVolume(L, { mask, shadowW: 46, shadowA: 0.8, rimW: 7, rimA: 0.5, rimFocus: [360, 300, 560], litA: 0.3 });

function drawTeeth(g) {

    const gr = g.createLinearGradient(x, y, x, y + (down ? len : -len));

    g.fillStyle = gr;
    g.beginPath(); g.moveTo(x - len * 0.28, y); g.quadraticCurveTo(x - 1, y + (down ? len * 0.6 : -len * 0.6), x + 1, y + (down ? len : -len));
    g.quadraticCurveTo(x + len * 0.12, y + (down ? len * 0.4 : -len * 0.4), x + len * 0.3, y); g.fill();
  };
  // de cima (para baixo)
  [[236, 283, 16], [262, 285, 10], [286, 287, 13], [312, 290, 9], [336, 293, 12], [358, 296, 8]].forEach(([x, y, l]) => tooth(x, y, l, true));
  // de baixo (para cima)
  [[262, 334, 14], [288, 329, 9], [314, 324, 12], [340, 319, 8], [364, 314, 10]].forEach(([x, y, l]) => tooth(x, y, l, false));
  g.restore();

  const gr = g.createRadialGradient(380, 306, 2, 380, 306, 90);

}

function drawHorn(g, base, ctrl, tip, w0) {
  const T = tube([base, ctrl, tip], t => lerp(w0, 2, Math.pow(t, 0.8)), 60);
  const L = layer(), h = L.getContext('2d');
  h.beginPath(); tubePath(h, T);
  const gr = h.createLinearGradient(base[0], base[1], tip[0], tip[1]);
  gr.addColorStop(0, '#8a6e5a'); gr.addColorStop(0.3, '#d8c8a8'); gr.addColorStop(1, '#f4ead4');
  h.fillStyle = gr; h.fill();
  h.save(); h.globalCompositeOperation = 'source-atop';
  // anéis
  for (let i = 4; i < 40; i += 4) {
    const c = T.C[i], [nx, ny] = T.N[i], w = T.W[i];
    h.strokeStyle = 'rgba(90,60,50,0.35)'; h.lineWidth = 2;
    h.beginPath(); h.moveTo(c[0] + nx * w, c[1] + ny * w); h.quadraticCurveTo(c[0] + T.N[i][2] * 5, c[1] + T.N[i][3] * 5, c[0] - nx * w, c[1] - ny * w); h.stroke();
  }
  h.restore();
  const mask = layer(); mask.getContext('2d').drawImage(L, 0, 0);
  h.save(); h.globalCompositeOperation = 'source-atop';
  h.globalAlpha = 0.6; h.drawImage(tint(edge(mask, -8, -6), 'rgb(90,50,60)', 3), 0, 0);
  h.globalAlpha = 0.9; h.drawImage(tint(edge(mask, 3, 4), 'rgb(255,250,235)', 1), 0, 0);
  h.restore();
  g.drawImage(L, 0, 0);
}

function drawLeg(g, parts, claws, opt = {}) {
  const L = layer(), d = L.getContext('2d');
  d.fillStyle = rgb(opt.base || RED.base);
  for (const p of parts) {
    if (p.tube) { d.beginPath(); tubePath(d, tube(p.tube, p.w, 40)); d.fill(); }
    if (p.ell) { d.beginPath(); d.ellipse(...p.ell, 0, Math.PI * 2); d.fill(); }
    if (p.poly) { d.beginPath(); smooth(d, p.poly); d.fill(); }
  }
  const mask = layer(); mask.getContext('2d').drawImage(L, 0, 0);
  d.save(); d.globalCompositeOperation = 'source-atop';
  const b = opt.box;
  let gr = d.createLinearGradient(b[0], b[1], b[2], b[3]);
  gr.addColorStop(0, rgb(opt.dark ? RED.base : RED.light)); gr.addColorStop(0.5, rgb(opt.dark ? RED.mid : RED.base)); gr.addColorStop(1, rgb(RED.shadow));
  d.fillStyle = gr; d.fillRect(0, 0, S, S);
  // luz refletida do ouro por baixo
  gr = d.createLinearGradient(0, b[3] - 80, 0, b[3]);
  gr.addColorStop(0, 'rgba(255,170,60,0)'); gr.addColorStop(1, 'rgba(255,170,60,0.35)');
  d.globalCompositeOperation = 'screen'; d.fillStyle = gr; d.fillRect(0, 0, S, S);
  d.globalCompositeOperation = 'source-atop';
  for (const p of parts) if (p.tube && p.scales) scalesAlong(d, tube(p.tube, p.w, 40), { cols: 9, step: 2 });
  d.restore();
  shadeVolume(L, { mask, shadowW: 18, shadowA: 0.65, shadowBlur: 10, rimW: 5, rimA: opt.rimA ?? 0.5, rimFocus: [360, 300, 600] });
  if (opt.fade) { // o topo se funde ao corpo (sem emenda)
    d.save(); d.globalCompositeOperation = 'destination-in';
    const fg = d.createLinearGradient(0, opt.fade[0], 0, opt.fade[1]);
    fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,0,0,1)');
    d.fillStyle = fg; d.fillRect(0, 0, S, S); d.restore();
  }
  if (opt.drop) { // sombra projetada no que está atrás
    g.save(); g.filter = 'blur(10px)'; g.globalAlpha = 0.5;
    g.drawImage(tint(L, 'rgb(30,5,20)', 0), 10, 8); g.restore();
  }
  g.drawImage(L, 0, 0);
  // garras
  for (const [x, y, a, len] of claws) {
    const tx = x + Math.cos(a) * len, ty = y + Math.sin(a) * len;
    const nx = -Math.sin(a), ny = Math.cos(a);
    gr = g.createLinearGradient(x, y, tx, ty);
    gr.addColorStop(0, '#3a2220'); gr.addColorStop(0.5, '#a89888'); gr.addColorStop(1, '#efe4d0');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(x + nx * 6, y + ny * 6);
    g.quadraticCurveTo(x + Math.cos(a) * len * 0.6 + nx * 8, y + Math.sin(a) * len * 0.6 + ny * 8, tx, ty);
    g.quadraticCurveTo(x + Math.cos(a) * len * 0.5 - nx * 2, y + Math.sin(a) * len * 0.5 - ny * 2, x - nx * 6, y - ny * 6);
    g.closePath(); g.fill();
  }
}

function drawTail(g) {
  const L = layer(), d = L.getContext('2d');
  d.fillStyle = rgb(RED.base); d.beginPath(); tubePath(d, TAIL); d.fill();
  const mask = layer(); mask.getContext('2d').drawImage(L, 0, 0);
  d.save(); d.globalCompositeOperation = 'source-atop';
  let gr = d.createLinearGradient(0, 600, 0, 940);
  gr.addColorStop(0, rgb(RED.mid)); gr.addColorStop(0.5, rgb(RED.base)); gr.addColorStop(1, rgb(RED.shadow));
  d.fillStyle = gr; d.fillRect(0, 0, S, S);
  gr = d.createLinearGradient(260, 0, 1020, 0);
  gr.addColorStop(0, 'rgba(255,140,80,0.35)'); gr.addColorStop(0.5, 'rgba(255,140,80,0)'); gr.addColorStop(1, 'rgba(60,10,40,0.5)');
  d.fillStyle = gr; d.fillRect(0, 0, S, S);
  // faixa ventral do lado de baixo/de dentro
  d.save(); d.beginPath();
  for (let i = 0; i < TAIL.C.length; i++) { const c = TAIL.C[i], [nx, ny] = TAIL.N[i], w = TAIL.W[i]; const p = [c[0] - nx * w * 0.3, c[1] - ny * w * 0.3]; i ? d.lineTo(p[0], p[1]) : d.moveTo(p[0], p[1]); }
  for (let i = TAIL.C.length - 1; i >= 0; i--) { const c = TAIL.C[i], [nx, ny] = TAIL.N[i], w = TAIL.W[i]; d.lineTo(c[0] - nx * w * 1.2, c[1] - ny * w * 1.2); }
  d.closePath(); d.clip();
  d.fillStyle = 'rgba(220,110,70,0.5)'; d.fillRect(0, 0, S, S);
  for (let i = 3; i < TAIL.C.length - 6; i += 4) {
    const c = TAIL.C[i], [nx, ny] = TAIL.N[i], w = TAIL.W[i];
    d.strokeStyle = 'rgba(110,30,40,0.5)'; d.lineWidth = 1.6;
    d.beginPath(); d.moveTo(c[0] - nx * w * 0.3, c[1] - ny * w * 0.3); d.lineTo(c[0] - nx * w * 1.1 + TAIL.N[i][2] * 4, c[1] - ny * w * 1.1 + TAIL.N[i][3] * 4); d.stroke();
  }
  d.restore();
  scalesAlong(d, TAIL, { cols: 10, step: 2 });
  d.restore();
  shadeVolume(L, { mask, shadowW: 22, shadowA: 0.6, shadowBlur: 12, rimW: 5, rimA: 0.45, rimFocus: [360, 700, 520] });
  // a base da cauda se funde ao corpo
  d.save(); d.globalCompositeOperation = 'destination-in';
  gr = d.createRadialGradient(935, 640, 1, 935, 640, 2);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)');
  d.fillStyle = gr; d.fillRect(0, 0, S, S); d.restore();
  // sombra projetada no ouro
  g.save(); g.filter = 'blur(12px)'; g.globalAlpha = 0.55; g.drawImage(tint(L, 'rgb(60,15,15)', 0), 8, 16); g.restore();
  g.drawImage(L, 0, 0);
}

function sparkle(g, x, y, r, a = 1) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a;
  let gr = g.createRadialGradient(x, y, 0, x, y, r * 1.2);
  gr.addColorStop(0, 'rgba(255,255,230,0.9)'); gr.addColorStop(0.3, 'rgba(255,220,120,0.35)'); gr.addColorStop(1, 'rgba(255,200,80,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 1.2, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,250,220,0.9)';
  for (const [dx, dy] of [[1, 0], [0, 1]]) {
    g.beginPath();
    g.moveTo(x - dx * r * 2.4, y - dy * r * 2.4);
    g.quadraticCurveTo(x + dy * r * 0.12, y + dx * r * 0.12, x + dx * r * 2.4, y + dy * r * 2.4);
    g.quadraticCurveTo(x - dy * r * 0.12, y - dx * r * 0.12, x - dx * r * 2.4, y - dy * r * 2.4);
    g.fill();
  }
  g.restore();
}

  g.save(); g.filter = 'blur(28px)'; g.globalCompositeOperation = 'multiply';
  g.fillStyle = 'rgba(70,20,30,0.85)';
  g.beginPath(); g.ellipse(700, 720, 330, 60, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(450, 760, 120, 50, 0, 0, Math.PI * 2); g.fill();
  g.filter = 'none'; g.restore();
}

// moedas por cima dos pés e da cauda (enterrados no ouro)
function burying(g) {
  seed = 777;
  const L = goldLight(690);
  const put = (x, y) => coin(g, x, y, lerp(5, 11, clamp((y - 680) / 344, 0, 1)) * rr(0.8, 1.2), L(x, y) - 0.05 + rr(-0.12, 0.1), rr(-0.5, 0.5));
  // dedos cravados: moedas sobre a base das garras
  for (const [cx, cy, rx] of [[420, 840, 58], [562, 836, 34], [826, 850, 50]]) {
    for (let i = 0; i < rx * 1.6; i++) {
      const x = cx + rr(-rx, rx), k = 1 - Math.pow((x - cx) / rx, 2);
      put(x, cy + rr(-4, 10) * k + rr(0, 6));
    }
  }
  // cauda afundando no ouro: moedas ao longo da borda de baixo, irregulares
  const T = TAIL, M = T.C.length - 1;
  for (let i = Math.round(M * 0.3); i < M; i++) {
    const c = T.C[i], [nx, ny] = T.N[i], w = T.W[i];
    const sink = 0.5 + 0.5 * Math.sin(i * 0.21) * Math.sin(i * 0.07 + 1);
    const nCoins = rnd() < 0.35 ? 0 : 1 + Math.round(sink * 3 * rnd());
    for (let k = 0; k < nCoins; k++) {
      const d = w * (1 - sink * 0.9) + rr(-2, 10);
      put(c[0] - nx * d + rr(-6, 6), c[1] - ny * d + rr(-2, 6));
    }
  }
}

function drawDust(g, t, motes) {
  g.save();
  beamPolygon(g, 20); g.clip();
  g.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const x = m.x + Math.sin(t * m.f + m.p) * 10 + t * 4 * m.s;
    const y = ((m.y + t * m.v) % 800 + 800) % 800 - 20;
    const b = beamLight(x, y);
    const a = m.a * b * (0.6 + 0.4 * Math.sin(t * 2 * m.f + m.p));
    if (a < 0.02) continue;
    g.fillStyle = `rgba(255,230,180,${a})`;
    g.beginPath(); g.arc(x, y, m.r, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

/* ---------- composição ---------- */
const base = layer();
function render() {
  const g = base.getContext('2d');
  drawBackground(g);
  drawBeam(g, 0.9);
  drawBackPile(g);
  // asa de trás (mais escura, vista por trás)
  drawWing(g, {
    S: [600, 540], E: [545, 330], W: [610, 60], tips: [[480, 110], [478, 250], [520, 410]], attach: [590, 520],
    scallop: 0.28, reach: 420, memIn: [90, 18, 34], memOut: [130, 34, 40], alpha: 0.95, glow: [200, 60, 50], glowA: 0.25,
    vein: [40, 6, 20], fold: [40, 6, 24], bone: 7, boneC: [120, 26, 34], boneHi: [220, 90, 70], seed: 3, rimA: 0.35
  });
  // asa da frente (grande, à direita)
  drawWing(g, {
    S: [640, 545], E: [800, 395], W: [705, 175], tips: [[835, 28], [1002, 112], [1018, 322], [972, 520]], attach: [900, 575],
    scallop: 0.2, reach: 560, memIn: [120, 24, 34], memOut: [196, 70, 46], alpha: 0.96, glow: [255, 120, 60], glowA: 0.3,
    vein: [70, 10, 30], fold: [70, 10, 34], bone: 9, boneC: [170, 40, 34], boneHi: [255, 140, 90], seed: 9, rimA: 0.5
  });
  drawGoldMound(g);
  drawSword(g);
  drawChalice(g, 188, 868, 1.0);
  dragonShadowOnGold(g);
  // pata dianteira de trás (mais escura, no lado oposto)
  drawLeg(g, [
    { tube: [[590, 640], [600, 720], [585, 790], [568, 818]], w: t => lerp(78, 40, t) },
    { ell: [562, 824, 34, 15, 0] }
  ], [[538, 828, 2.0, 24], [558, 834, 1.75, 26], [578, 834, 1.45, 22]], { box: [540, 640, 640, 840], dark: true, rimA: 0.1 });
  // espinhos do dorso (atrás da silhueta)
  spinesEdge(g, NECK, 1, -1, 0.12, 0.98, 11, t => lerp(22, 13, t));
  spinesEdge(g, BODY, -1, 1, 0.12, 0.95, 9, t => 20 + 6 * Math.sin(t * Math.PI));
  spinesEdge(g, TAIL, -1, 1, 0.1, 0.32, 6, t => lerp(20, 12, t));
  drawTail(g);
  // chifres (a base fica atrás do crânio)
  drawHorn(g, [440, 205], [478, 150], [575, 128], 32);
  drawHorn(g, [400, 205], [420, 130], [505, 92], 30);
  drawMouth(g);
  const body = drawDragonBody(g);
  g.save(); g.filter = 'blur(14px)'; g.globalAlpha = 0.4; g.drawImage(tint(body, 'rgb(30,5,20)', 0), 6, 10); g.restore();
  g.drawImage(body, 0, 0);
  drawTeeth(g);
  // espinhos da bochecha
  for (const [x, y, a] of [[452, 300, 0.4], [462, 270, 0.0], [438, 330, 0.9], [470, 240, -0.3]]) {
    g.save(); g.translate(x, y); g.rotate(a);
    const gr = g.createLinearGradient(0, 0, 30, 0); gr.addColorStop(0, '#8a5a48'); gr.addColorStop(1, '#f4e8d0');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, -6); g.quadraticCurveTo(18, -3, 32, 0); g.quadraticCurveTo(18, 3, 0, 6); g.fill(); g.restore();
  }
  // perna traseira: canela e pé (a coxa faz parte do corpo)
  drawLeg(g, [
    { tube: [[895, 690], [908, 745], [880, 795], [845, 826]], w: t => lerp(108, 54, t), scales: true },
    { ell: [826, 834, 50, 19, 0] }
  ], [[792, 838, 2.15, 28], [814, 846, 1.85, 30], [838, 847, 1.55, 28], [860, 842, 1.25, 22]], { box: [800, 690, 950, 850], drop: true, fade: [690, 735], rimA: 0.25 });
  // pata dianteira da frente: antebraço e mão (o braço faz parte do corpo)
  drawLeg(g, [
    { tube: [[482, 705], [470, 760], [446, 800], [430, 818]], w: t => lerp(86, 54, t), scales: true },
    { ell: [424, 826, 50, 19, -0.08] }
  ], [[388, 828, 2.25, 30], [408, 836, 1.95, 34], [434, 840, 1.65, 30], [458, 834, 1.35, 24]], { box: [390, 700, 520, 840], drop: true, fade: [700, 735], rimA: 0.35 });
  burying(g);
  // tesouros
  drawCrown(g, 520, 868, 0.8, -0.08);
  drawHelmet(g, 185, 950);
  drawChalice(g, 700, 912, 0.7);
  drawChest(g, 905, 975);
  seed = 2024;
  for (const [x, y, r, c] of [[408, 738, 7, '#e02040'], [690, 870, 7, '#20c060'], [740, 862, 5, '#20c060'], [700, 762, 6, '#3070ff'], [300, 845, 5, '#e02040'],
    [160, 880, 6, '#e02040'], [70, 965, 6, '#3070ff'], [120, 990, 5, '#e02040'], [270, 955, 6, '#e02040'], [600, 760, 5, '#3070ff'], [960, 900, 6, '#3070ff'], [900, 955, 5, '#20c060']]) gem(g, x, y, r, c);
  // brilhos em estrela fixos
  seed = 31;
  for (let i = 0; i < 46; i++) {
    const x = rr(20, 1000), y = rr(700, 1010); const L = goldLight(690)(x, y);
    if (L > 0.55) sparkle(g, x, y, rr(1.5, 4) * L, 0.8);
  }
  // feixe na frente (névoa) + névoa quente baixa
  drawBeam(g, 0.35);
  g.save(); g.globalCompositeOperation = 'screen';
  let gr = g.createLinearGradient(0, 640, 0, 800);
  gr.addColorStop(0, 'rgba(200,110,50,0)'); gr.addColorStop(0.5, 'rgba(200,110,50,0.12)'); gr.addColorStop(1, 'rgba(200,110,50,0)');
  g.fillStyle = gr; g.fillRect(0, 600, S, 220); g.restore();
  // vinheta
  gr = g.createRadialGradient(500, 500, 300, 512, 540, 760);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,2,8,0.75)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  // gradação de cor quente
  g.save(); g.globalCompositeOperation = 'soft-light'; g.fillStyle = 'rgba(255,150,80,0.18)'; g.fillRect(0, 0, S, S); g.restore();
}

render();

/* ---------- animação sutil ---------- */
seed = 4242;
const motes = Array.from({ length: 220 }, () => ({ x: rr(150, 700), y: rr(0, 800), r: rr(0.6, 2.2), a: rr(0.3, 0.9), f: rr(0.2, 0.8), p: rr(0, 6.28), v: rr(-6, 6), s: rr(-1, 1) }));
const twinkles = Array.from({ length: 30 }, () => { const x = rr(60, 980), y = rr(710, 1000); return { x, y, r: rr(2, 4.5), p: rr(0, 6.28), f: rr(0.6, 1.6), L: goldLight(690)(x, y) }; }).filter(t => t.L > 0.5);
const start = performance.now();
function frame(now) {
  const t = (now - start) / 1000;
  vctx.drawImage(base, 0, 0);
  drawDust(vctx, t, motes);
  for (const tw of twinkles) {
    const a = Math.pow(Math.max(0, Math.sin(t * tw.f + tw.p)), 6);
    if (a > 0.03) sparkle(vctx, tw.x, tw.y, tw.r, a);
  }
  // brasa da garganta pulsando
  vctx.save(); vctx.globalCompositeOperation = 'lighter';
  const pulse = 0.12 + 0.08 * Math.sin(t * 1.7);
  const gr = vctx.createRadialGradient(385, 306, 2, 385, 306, 60);
  gr.addColorStop(0, `rgba(255,170,60,${pulse})`); gr.addColorStop(1, 'rgba(255,90,20,0)');
  vctx.fillStyle = gr; vctx.fillRect(320, 250, 130, 110); vctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
</script>
