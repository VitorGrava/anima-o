<head>

<title>Pombo Tático</title>
<style>
  :root { --bg: #14151d; --panel: #1d1f2a; --line: #2e3144; --text: #ecebf4; --muted: #8d8fa6; --accent: #ffc928; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #232637 0%, var(--bg) 70%);
    color: var(--text); font: 14px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
  }
  canvas { width: min(92vw, 80vh, 720px); aspect-ratio: 1; display: block; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  label { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  input[type=range] { accent-color: var(--accent); }
</style>
</head>

// ---------- palco ----------
const ART = 240;                 // palco em pixels de arte
const OFF = [24, 22];            // posição do frame 192×208 dentro do palco
const GROUND = OFF[1] + 204;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let S = 4;                       // pixels de tela por pixel de arte
function resize() {
  const css = cv.getBoundingClientRect().width;
  S = Math.max(2, Math.round((css * devicePixelRatio) / ART));
  cv.width = cv.height = ART * S;
}

// ---------- sprites ----------
const img = {};
function load(name) {
  return new Promise((ok) => { const i = new Image(); i.onload = () => ok((img[name] = i)); i.src = SRC[name]; });
}
function pixels(rows, pal) {
  const c = document.createElement("canvas");
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext("2d");
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}

// olhos de pombo: íris laranja, pupila preta, anel claro; pálpebra com a cor do rosto
const EYE_ROWS = {
  open: [
    "....11111....",
    "..11LLLLL11..",
    ".1LLLLLLLLL1.",
    "1rr1111111rr1",
    "1rroo000oorr1",
    "1rro00h00orr1",

    "....11111....",
  ],
  half: [

    "..11LLLLL11..",
    ".1LLLLLLLLL1.",
    "1LLLLLLLLLLL1",
    "1LL1111111LL1",
    "1rro00000orr1",
    ".1rroo0oorr1.",
    "..11rrrrr11..",
    "....11111....",
  ],
  closed: [
    "....11111....",
    "..11LLLLL11..",
    ".1LLLLLLLLL1.",
    "1LLLLLLLLLLL1",
    "1LLLLLLLLLLL1",
    "11LLLLLLLLL11",
    ".111LLLLL111.",
    "...1111111...",
    ".............",
  ],
};
const FLASH_ROWS = [
  "........r.........",
  "...r...ryr....r...",
  "....r.ryyyr..r....",
  "..rryyywwwyyyrr...",
  ".ryywwwwwwwwwwyyrr",
  "..rryyywwwyyyrr...",
  "....r.ryyyr..r....",
  "...r...ryr....r...",
  "........r.........",
];
const FX_PAL = { r: "#ff7a1a", y: "#ffd84a", w: "#fffbe8" };
const CASING = pixels(["uuu", "vuu"], { u: "#e0a93c", v: "#8d5f1c" });
let EYE = {}, FLASH;

// ---------- easing ----------
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const E = {
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: (t) => 1 - Math.pow(1 - t, 3),
  in: (t) => t * t * t,
  back: (t) => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  bounce: (t) => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
};
const seg = (t, a, b, e = E.inOut) => e(clamp01((t - a) / (b - a)));
const mix = (a, b, k) => a + (b - a) * k;
const mixPose = (A, B, k) => A.map((v, i) => mix(v, B[i], k));

// ---------- coreografia ----------
// asa: [ângulo, escala, dx, dy] em torno do ombro; 0° = asa levantada como no desenho original
const SHOULDER = [44, 124];
const WING = {
  rest:  [110, 0.85, 0, 0],
  up:    [-6, 1, 0, -2],
  touch: [24, 1, 3, -2],
  push:  [26, 1, 4, -22],
};
const GLASS_LIFT = 20;
const RIFLE_PIVOT = [95, 128];
const RIFLE_UP = -40;
const SHOTS = [4.75, 5.0, 5.25];
const LOOP = 7.6;

function wingPose(t) {
  if (t < 0.7) return WING.rest;
  if (t < 1.3) return mixPose(WING.rest, WING.up, seg(t, 0.7, 1.3, E.inOut));
  if (t < 1.55) return mixPose(WING.up, WING.touch, seg(t, 1.3, 1.55, E.out));
  if (t < 2.05) return mixPose(WING.touch, WING.push, seg(t, 1.6, 2.05, E.inOut));
  if (t < 2.25) return WING.push;
  return mixPose(WING.push, WING.rest, seg(t, 2.25, 2.95, E.inOut));
}

const particles = [];
let fired = -1, smoked = false;
function spawn(p) { particles.push({ age: 0, rot: 0, ...p }); }

// ---------- desenho ----------
function drawPiece(name, x, y, pivot, rot = 0, sc = 1, dx = 0, dy = 0) {
  const i = img[name];
  ctx.save();
  ctx.translate((OFF[0] + pivot[0] + dx) * S, (OFF[1] + pivot[1] + dy) * S);
  ctx.rotate((rot * Math.PI) / 180);
  ctx.scale(sc, sc);
  ctx.drawImage(i, (x - pivot[0]) * S, (y - pivot[1]) * S, i.width * S, i.height * S);
  ctx.restore();
}
function rotPoint(px, py, pivot, rot, dx = 0, dy = 0) {
  const a = (rot * Math.PI) / 180, lx = px - pivot[0], ly = py - pivot[1];
  return [pivot[0] + dx + lx * Math.cos(a) - ly * Math.sin(a), pivot[1] + dy + lx * Math.sin(a) + ly * Math.cos(a)];
}

function render(t, dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);

  // fuzil
  const raise = seg(t, 4.2, 4.6, E.back) * (1 - seg(t, 6.55, 7.15, E.inOut));
  let kick = 0;
  for (const s of SHOTS) if (t >= s) kick = Math.max(kick, Math.exp(-(t - s) * 20));
  const rRot = RIFLE_UP * raise - kick * 6;
  const rDx = -kick * 2, rDy = kick * 1.5;

  // corpo inteiro: respiração + recuo, com pivô nos pés
  const breath = Math.sin((t * Math.PI * 2) / 1.9);
  const sy = 1 + breath * 0.008 - kick * 0.025, sx = 1 - breath * 0.004 + kick * 0.015;
  const shake = kick * 1.6;
  ctx.translate((Math.random() - 0.5) * shake * S, (Math.random() - 0.5) * shake * S);
  ctx.translate((OFF[0] + 96) * S, GROUND * S);
  ctx.scale(sx, sy);
  ctx.translate(-(OFF[0] + 96) * S, -GROUND * S);

  // sombra no chão
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.ellipse((OFF[0] + 94) * S, (GROUND + 1) * S, 46 * S, 5 * S, 0, 0, Math.PI * 2);
  ctx.fill();

  drawPiece("body", 0, 0, [0, 0]);

  // olhos (atrás dos óculos)
  const winkR = t > 3.1 && t < 3.55 ? (t < 3.17 || t > 3.48 ? "half" : "closed") : "open";
  const winkL = t > 3.17 && t < 3.48 ? "half" : "open";
  for (const [i, st] of [[0, winkL], [1, winkR]]) {
    const [ex, ey] = META.eyes[i];
    const e = EYE[st];
    ctx.drawImage(e, (OFF[0] + ex - 6.5) * S, (OFF[1] + ey - 4.5) * S, e.width * S, e.height * S);
  }

  // óculos: sobem empurrados pela asa, caem de volta com um quique
  const lift = GLASS_LIFT * seg(t, 1.6, 2.05, E.inOut) * (1 - seg(t, 3.85, 4.25, E.bounce));
  const tilt = -7 * seg(t, 1.6, 2.05, E.inOut) * (1 - seg(t, 3.85, 4.25, E.bounce));
  const g = META.glasses;
  drawPiece("glasses", g.x, g.y, [g.x + g.w / 2, g.y + g.h / 2], tilt, 1, 0, -lift);

  // fuzil + asa direita
  const r = META.rifle;
  drawPiece("rifle", r.x, r.y, RIFLE_PIVOT, rRot, 1, rDx, rDy);

  // asa esquerda
  const [wa, ws, wdx, wdy] = wingPose(t);
  const w = META.lwing;
  drawPiece("lwing", w.x, w.y, SHOULDER, wa, ws, wdx, wdy);

  // ---- efeitos ----
  SHOTS.forEach((s, i) => {
    if (t >= s && fired < i) {
      fired = i;
      const [ex, ey] = rotPoint(92, 116, RIFLE_PIVOT, rRot, rDx, rDy);
      spawn({ kind: "casing", x: ex, y: ey, vx: 30 + Math.random() * 18, vy: -70 - Math.random() * 25, vr: 700 + Math.random() * 500, life: 2.2 });
      const [mx, my] = rotPoint(188, 97, RIFLE_PIVOT, rRot, rDx, rDy);
      for (let k = 0; k < 2; k++) spawn({ kind: "smoke", x: mx, y: my, vx: (Math.random() - 0.3) * 10, vy: -10 - Math.random() * 8, life: 1.4 + Math.random() * 0.6, r0: 2 + Math.random() * 2 });
    }
  });
  if (t >= SHOTS[2] + 0.12 && !smoked) {
    smoked = true;
    const [mx, my] = rotPoint(188, 97, RIFLE_PIVOT, rRot, rDx, rDy);
    for (let k = 0; k < 5; k++) spawn({ kind: "smoke", x: mx + k, y: my - k, vx: (Math.random() - 0.4) * 8, vy: -6 - k * 2, life: 2 + Math.random(), r0: 2.5 + k * 0.4 });
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.kind === "casing") {
      p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > GROUND - OFF[1] - 1 && p.vy > 0) { p.y = GROUND - OFF[1] - 1; p.vy *= -0.38; p.vx *= 0.6; p.vr *= 0.5; }
      const a = p.age > p.life - 0.4 ? (p.life - p.age) / 0.4 : 1;
      ctx.save(); ctx.globalAlpha = Math.max(0, a);
      ctx.translate((OFF[0] + p.x) * S, (OFF[1] + p.y) * S); ctx.rotate((p.rot * Math.PI) / 180);
      ctx.drawImage(CASING, -1.5 * S, -1 * S, 3 * S, 2 * S); ctx.restore();
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.99; p.vy *= 0.985;
      const k = p.age / p.life, rad = p.r0 * (1 + k * 2.4);
      ctx.save(); ctx.globalAlpha = Math.max(0, 0.75 * (1 - k));
      // fumaça em "pixels": círculo quantizado na grade de arte
      ctx.fillStyle = k < 0.3 ? "#e3e3ec" : "#bdbdcc";
      const R = Math.round(rad);
      for (let yy = -R; yy <= R; yy++) for (let xx = -R; xx <= R; xx++)
        if (xx * xx + yy * yy <= rad * rad) ctx.fillRect(Math.round((OFF[0] + p.x + xx) * S), Math.round((OFF[1] + p.y + yy) * S), S, S);
      ctx.restore();
    }
    if (p.age >= p.life) particles.splice(i, 1);
  }

  // clarão do disparo + luz
  const shot = SHOTS.findIndex((s) => t >= s && t < s + 0.075);
  if (shot >= 0) {
    const [mx, my] = rotPoint(188, 97, RIFLE_PIVOT, rRot, rDx, rDy);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const glow = ctx.createRadialGradient((OFF[0] + mx) * S, (OFF[1] + my) * S, 0, (OFF[0] + mx) * S, (OFF[1] + my) * S, 46 * S);
    glow.addColorStop(0, "rgba(255,200,90,0.55)"); glow.addColorStop(1, "rgba(255,160,40,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.restore();
    ctx.save();
    ctx.translate((OFF[0] + mx) * S, (OFF[1] + my) * S);
    ctx.rotate(((rRot - 12 + (Math.random() - 0.5) * 10) * Math.PI) / 180);
    const sc = 1.3 + Math.random() * 0.5;
    ctx.drawImage(FLASH, -1 * S, (-FLASH.height / 2) * S * sc, FLASH.width * S * sc, FLASH.height * S * sc);
    ctx.restore();
  }
}

// ---------- loop ----------
let t = 0, last = performance.now(), playing = true, speed = 1;
function reset() { t = 0; fired = -1; smoked = false; particles.length = 0; }
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * speed;
  last = now;
  if (playing) { t += dt; if (t >= LOOP) reset(); render(t, dt); }
  requestAnimationFrame(tick);
}
// usado para gerar quadros de conferência
window.__seek = (time) => { reset(); for (let x = 0; x <= time; x += 1 / 60) render(x, 1 / 60); playing = false; };

Promise.all(["body", "lwing", "rifle", "glasses"].map(load)).then(() => {
  // pálpebra com a cor do rosto ao lado do olho
  const probe = document.createElement("canvas"); probe.width = 192; probe.height = 208;
  const pg = probe.getContext("2d"); pg.drawImage(img.body, 0, 0);
  const [ex, ey] = META.eyes[0];
  const d = pg.getImageData(Math.round(ex) - 9, Math.round(ey), 1, 1).data;
  const lid = `rgb(${d[0]},${d[1]},${d[2]})`;
  const pal = { 1: "#1b1a24", L: lid, r: "#cfcddc", o: "#e8762b", 0: "#121118", h: "#ffffff" };
  EYE = Object.fromEntries(Object.entries(EYE_ROWS).map(([k, rows]) => [k, pixels(rows, pal)]));
  FLASH = pixels(FLASH_ROWS, FX_PAL);
  resize();
  addEventListener("resize", resize);
  document.getElementById("play").onclick = (e) => { playing = !playing; e.target.textContent = playing ? "❚❚ Pausar" : "▶ Play"; last = performance.now(); };
  document.getElementById("restart").onclick = () => { reset(); playing = true; document.getElementById("play").textContent = "❚❚ Pausar"; };
  document.getElementById("speed").oninput = (e) => (speed = Number(e.target.value));
  requestAnimationFrame(tick);
});
